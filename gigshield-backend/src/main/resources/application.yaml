spring:
  config:
    import: optional:application-secrets.yml
  application:
    name: gigshield

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gigshield?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: GigShieldHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 1000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: gigshield-backend
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all

  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: Asia/Kolkata

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: GigShield
    description: Parametric micro-insurance for gig workers
    version: 1.0.0

gigshield:
  otp:
    expiry-minutes: 5
    max-attempts: 3

    sms:
      mock: ${SMS_MOCK:true}
      provider-url: ${SMS_PROVIDER_URL:}
      api-key: ${SMS_API_KEY:}



  jwt:
    secret: ${JWT_SECRET}
    expiry-ms: 86400000

  ml:
    base-url: ${ML_BASE_URL:http://localhost:5000}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

  razorpay:
    payout-account-id: ${RAZORPAY_PAYOUT_ACCOUNT_ID:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

  monitored-cities: Delhi,Mumbai,Bengaluru,Chennai,Hyderabad,Kolkata
  scheduler:
      poll-interval-ms: 900000



  cache:
    risk-score-ttl-sec: 3600
    session-ttl-sec: 86400
    trigger-ttl-sec: 900

logging:
  level:
    root: INFO
    com.gigshield: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file:    "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/gigshield.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30