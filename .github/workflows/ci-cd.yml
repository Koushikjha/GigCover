name: GigShield CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-push:
    name: Build, Run and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend
        run: |
          docker build \
            -t koushikjha/gigshield-backend:latest \
            -t koushikjha/gigshield-backend:${{ github.sha }} \
            ./gigshield-backend

      - name: Build ML
        run: |
          docker build \
            -t koushikjha/gigshield-ml:latest \
            -t koushikjha/gigshield-ml:${{ github.sha }} \
            ./gigshield-ml

      - name: Build Frontend
        env:
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8080 \
            --build-arg VITE_RAZORPAY_KEY_ID="$VITE_RAZORPAY_KEY_ID" \
            -t koushikjha/gigshield-frontend:latest \
            -t koushikjha/gigshield-frontend:${{ github.sha }} \
            ./gigshield-frontend

      - name: Start Application
        run: |
          docker compose up -d

      - name: Check Services
        run: |
          docker compose ps

      - name: Push Backend
        run: |
          docker push koushikjha/gigshield-backend:latest
          docker push koushikjha/gigshield-backend:${{ github.sha }}

      - name: Push ML
        run: |
          docker push koushikjha/gigshield-ml:latest
          docker push koushikjha/gigshield-ml:${{ github.sha }}

      - name: Push Frontend
        run: |
          docker push koushikjha/gigshield-frontend:latest
          docker push koushikjha/gigshield-frontend:${{ github.sha }}

      - name: Stop Application
        if: always()
        run: |
          docker compose down
