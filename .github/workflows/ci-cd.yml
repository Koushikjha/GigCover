name: GigShield CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-push:
    name: Build, Run and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Images
        env:
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
        run: |
          docker compose build

      - name: Start Application
        env:
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
        run: |
          docker compose up -d

      - name: Check Services
        run: |
          docker compose ps

      - name: Tag Images
        run: |
          docker tag koushikjha/gigshield-backend:latest \
            koushikjha/gigshield-backend:${{ github.sha }}

          docker tag koushikjha/gigshield-frontend:latest \
            koushikjha/gigshield-frontend:${{ github.sha }}

          docker tag koushikjha/gigshield-ml:latest \
            koushikjha/gigshield-ml:${{ github.sha }}

      - name: Push Images
        run: |
          docker push koushikjha/gigshield-backend:latest
          docker push koushikjha/gigshield-backend:${{ github.sha }}

          docker push koushikjha/gigshield-frontend:latest
          docker push koushikjha/gigshield-frontend:${{ github.sha }}

          docker push koushikjha/gigshield-ml:latest
          docker push koushikjha/gigshield-ml:${{ github.sha }}

      - name: Stop Application
        if: always()
        run: |
          docker compose down
