services:

  backend:
    image: koushikjha/gigshield-backend:latest
    build:
      context: ./gigshield-backend
      dockerfile: Dockerfile
    container_name: gigshield-backend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      ML_SERVICE_URL: http://ml:5000
    depends_on:
      ml:
        condition: service_healthy
    networks:
      - gigshield-network
    restart: unless-stopped

  ml:
    image: koushikjha/gigshield-ml:latest
    build:
      context: ./gigshield-ml
      dockerfile: Dockerfile
    container_name: gigshield-ml
    ports:
      - "5000:5000"
    environment:
      ML_PORT: 5000
      PYTHONUNBUFFERED: 1
    networks:
      - gigshield-network
    restart: unless-stopped

  frontend:
    image: koushikjha/gigshield-frontend:latest
    build:
      context: ./gigshield-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
    container_name: gigshield-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gigshield-network
    restart: unless-stopped

networks:
  gigshield-network:
    driver: bridge
