services:

  backend:
    image: koushikjha/gigshield-backend:latest
    container_name: gigshield-backend
    ports:
      - "8080:8080"
    networks:
      - gigshield-network

  ml:
    image: koushikjha/gigshield-ml:latest
    container_name: gigshield-ml
    ports:
      - "5000:5000"
    networks:
      - gigshield-network

  frontend:
    image: koushikjha/gigshield-frontend:latest
    container_name: gigshield-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
      - ml
    networks:
      - gigshield-network

networks:
  gigshield-network:
    driver: bridge
